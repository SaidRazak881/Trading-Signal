# Koyeb free nano — https://www.koyeb.com
# Always-on free instance available (subject to Koyeb free tier limits).
# Deploy via dashboard (GitHub) or: koyeb app init signal-desk --docker
name: signal-desk
services:
  - name: web
    type: web
    routes:
      - path: /
    ports:
      - port: 8000
        protocol: http
    scalings:
      - min: 1
        max: 1
    instance_types:
      - type: free
    env:
      - key: HOST
        value: "0.0.0.0"
      - key: FORCE_DEMO
        value: "0"
